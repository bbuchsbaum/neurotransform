;font-size:10px;margin-bottom:6px;color:#a6bdc9}.slicecontrol label{width:66px;color:#dbe6ec;font-weight:600}.slicecontrol input{flex:1;accent-color:#62c5c7;max-width:370px;height:14px}.slicecontrol output{font:10px ui-monospace,monospace;min-width:45px}.planegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{position:relative;min-width:0;background:#060e14;border:1px solid #263640;border-radius:3px}.tile canvas{width:100%;height:auto;display:block}.orientation{position:absolute;inset:0;pointer-events:none;color:#a4bdc8;font:9px ui-monospace,monospace}.orientation .l{left:4px;top:50%;position:absolute}.orientation .r{right:4px;top:50%;position:absolute}.orientation .t{top:2px;left:50%;position:absolute}.orientation .b{bottom:2px;left:50%;position:absolute}.viewerfoot{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:#a5bcc9;margin:9px 1px 0}.ramp{display:inline-block;width:72px;height:7px;background:linear-gradient(90deg,#000004,#51127c,#b73779,#fc8961,#fcfdbf);margin:0 5px}.below{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.box{background:white;border:1px solid var(--line);border-radius:7px;padding:16px;min-width:0}.box h3{font-size:14px;margin:0 0 6px}.box p{font-size:11px;color:var(--muted);margin:0 0 8px}.box canvas{width:100%;height:auto}.legend{display:flex;gap:14px;font-size:10px;margin-bottom:8px}.legend span:before{content:"";display:inline-block;width:18px;border-top:2px solid currentColor;vertical-align:middle;margin-right:5px}table{border-collapse:collapse;width:100%;font-size:11px}th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:7px 4px}td{padding:7px 4px;border-bottom:1px solid #edf1f3}td.number{font:11px ui-monospace,monospace;text-align:right}.controlstable{margin-top:20px}.controlstable .box{padding:14px 16px}details{margin-top:20px;background:white;border:1px solid var(--line);border-radius:7px;padding:13px 16px}summary{cursor:pointer;font-weight:600;font-size:12px}details p,details li{font-size:12px;color:var(--muted)}details code{word-break:break-all;font-size:10px}.scope{font-size:12px;color:var(--muted);border-left:3px solid #c69d5d;padding:0 0 0 12px;margin:20px 0}.scope strong{color:var(--ink)}.unavailable-panel{padding:35px;border:1px solid #d8bd91;background:#fffbf3;border-radius:8px;color:#795526}.mono{font-family:ui-monospace,monospace}.mobile-select{display:none}footer{margin-top:22px;font-size:10px;color:var(--muted)}@media(min-width:1400px){.layout{grid-template-columns:250px minmax(0,1fr)}main{padding-left:30px;padding-right:30px}}@media(max-width:980px){header{padding:16px}.scoreboard{padding:12px 16px}.layout{grid-template-columns:190px minmax(0,1fr)}main{padding:18px 16px}aside{padding-left:8px}.metrics{grid-template-columns:repeat(2,1fr)}.below{grid-template-columns:1fr}.column-heads{font-size:9px}.toolbar{gap:9px}}@media(max-width:650px){header{align-items:flex-start;flex-direction:column;gap:10px}h1{font-size:20px}.scoreboard{align-items:flex-start;flex-direction:column;gap:8px}.counts b{font-size:19px}.layout{display:block}aside{border:0;padding:12px 16px 0}.family{display:none}.mobile-select{display:block;width:100%;padding:9px;background:white;border:1px solid #bdcdd4;border-radius:5px}main{padding:16px 12px}.casehead h2{font-size:20px}.planegrid{gap:3px}.viewer{padding:7px}.column-heads{gap:3px}.orientation{font-size:7px}.toolbar select{max-width:230px}.metric .value{font-size:17px}.viewerfoot{flex-direction:column;gap:4px}.tile canvas{min-height:65px}.counts{gap:14px}.toolbar label{font-size:10px}}@media print{header,.scoreboard,aside,.toolbar,.downloads,footer{display:none}.layout{display:block}main{padding:0}.viewer{break-inside:avoid}.below{break-inside:avoid}body{background:white}.box{break-inside:avoid}}

<header><div><h1>neurotransform <span style="font-weight:400;color:var(--muted)">/ interpretation QA</span></h1><small>Native-tool comparisons · local, reproducible evidence</small></div><nav class="downloads" aria-label="Report downloads"><a href="summary.json" download>Results JSON</a><a href="manifest.json" download>Provenance</a><a class="primary" href="visual-qa.pdf" download>Download PDF</a></nav></header>
<div class="scoreboard"><div><strong id="headline"></strong><p>Same source, target grid, saved transform, and interpolation. No registration-quality claim.</p></div><div class="counts" id="counts"></div></div>
<div class="layout"><aside id="cases" aria-label="Comparison cases"><select class="mobile-select" id="mobile-case" aria-label="Choose comparison case"></select></aside><main id="main"></main></div>
<script src="data.js"></script>
<script>
'use strict';
const Q=window.QA, main=document.querySelector('#main'), cases=document.querySelector('#cases');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=3)=>n==null?'unavailable':Math.abs(n)>=.01&&Math.abs(n)<1000?Number(n.toPrecision(d)).toString():n.toExponential(2);
let current=null, volumes={}, slices=[0,0,0];
document.querySelector('#headline').textContent=Q.failed?'Interpretation gaps found':Q.blocked?'Some evidence remains unavailable':'Native agreement in the tested cases';
document.querySelector('#counts').innerHTML=`<span class="pass"><b>${Q.passed}</b>pass</span><span class="fail"><b>${Q.failed}</b>fail</span><span class="unavailable"><b>${Q.blocked}</b>unavailable</span>`;
for(const family of ['ANTs','AFNI','FSL']){const group=document.createElement('section');group.className='family';group.innerHTML=`<h2>${family} <span style="float:right;font-weight:400">${esc(Q.versions[family])}</span></h2>`;for(const c of Q.cases.filter(c=>c.family===family)){const b=document.createElement('button');b.dataset.id=c.id;b.innerHTML=`<span class="dot ${c.status}"></span><span>${esc(c.title)}<span class="casekind">${c.scope==='anatomical'?'Acquired T1 replay':'Asymmetric phantom'}</span></span>`;b.onclick=()=>choose(c.id);group.append(b);const o=document.createElement('option');o.value=c.id;o.textContent=`${family} · ${c.title} [${c.status}]`;document.querySelector('#mobile-case').append(o)}cases.append(group)}
document.querySelector('#mobile-case').onchange=e=>choose(e.target.value);
function metric(label,value,gate,bad=false){return `<div class="metric"><div class="label">${label}</div><div class="value ${bad?'fail':''}">${value}</div><small>${gate}</small></div>`}
function choose(id){current=Q.cases.find(c=>c.id===id);const c=current;volumes={};for(const b of document.querySelectorAll('.family button'))b.setAttribute('aria-current',String(b.dataset.id===id));document.querySelector('#mobile-case').value=id;
 main.innerHTML=`<div class="casehead"><div><div class="eyebrow">${esc(c.family)} · ${c.scope==='anatomical'?'acquired anatomy':'synthetic convention test'}</div><h2>${esc(c.title)}</h2></div><span class="badge ${c.status}">${c.status.toUpperCase()}</span></div><p class="case-note">${esc((c.notes||[]).join(' '))}</p>`;
 if(c.status==='unavailable'){main.innerHTML+=`<div class="unavailable-panel">${esc(c.reason)}</div>`;return}
 const m=c.metrics;
 if(c.finding)main.innerHTML+=`<div class="scope"><strong>${c.finding.resolved?'Fixed regression.':'Observed failure.'}</strong> ${esc(c.finding.summary)} An independent basis conversion gives ${fmt(c.finding.diagnostic_basis_error_mm)} mm error. ${esc(c.finding.qualification)}</div>`;
 main.innerHTML+=`<div class="metrics">${metric('Max coordinate error',fmt(m.coordinate_max_mm)+' <small>mm</small>','Gate ≤ 0.02 mm',m.coordinate_max_mm==null||m.coordinate_max_mm>Q.gates.coordinate_max_mm)}${metric('Image NRMSE',fmt(m.image_nrmse),'Gate ≤ 0.0002',m.image_nrmse==null||m.image_nrmse>Q.gates.image_nrmse)}${metric('Native-defined interior',(100*m.mask_fraction).toFixed(1)+'<small>%</small>',m.samples.toLocaleString()+' target samples')}${metric('Invalid interior samples',m.invalid_samples.toLocaleString(),'Required: zero',m.invalid_samples>0)}</div>
 <div class="toolbar"><label>Interpretation<select id="scenario"><option value="ours">neurotransform</option>${c.variant_metrics.map(v=>`<option value="${v.id}">${esc(v.label)}</option>`).join('')}</select></label><label>Comparison<select id="comparison"><option value="checker">Checkerboard</option><option value="overlay">Overlay</option></select></label><label>Overlay opacity<input type="range" id="opacity" min="0" max="100" value="50" aria-label="Overlay opacity"></label><label>Diagnostic<select id="diagnostic"><option value="error">Image difference</option><option value="coord_error">Coordinate error</option><option value="jacobian">Jacobian determinant</option></select></label><a style="font-size:11px;margin-left:auto;padding-bottom:8px" href="panels/${c.id}.png" download>Download panel PNG ↗</a></div><p class="scenario-note" id="scenario-note"></p>
 <div class="viewer"><div class="column-heads"><span>Native reference</span><span id="candidate-label">neurotransform</span><span id="comparison-label">Checkerboard</span><span id="diagnostic-label">Absolute difference</span></div>${[2,1,0].map(axis=>`<div class="plane"><div class="slicecontrol"><label for="slice-${axis}">${['Sagittal','Coronal','Axial'][axis]}</label><input id="slice-${axis}" type="range" min="0" max="${c.dims[axis]-1}" value="${Math.floor(c.dims[axis]/2)}" aria-label="${['Sagittal','Coronal','Axial'][axis]} slice"><output id="slice-value-${axis}"></output><span id="world-${axis}"></span></div><div class="planegrid">${[0,1,2,3].map(col=>`<div class="tile"><canvas id="canvas-${axis}-${col}" width="480" height="290" aria-label="${['Sagittal','Coronal','Axial'][axis]} ${['native reference','candidate','comparison','diagnostic'][col]}"></canvas><div class="orientation" id="orientation-${axis}-${col}"></div></div>`).join('')}</div></div>`).join('')}<div class="viewerfoot"><span id="scale-label"></span><span>Magenta = invalid · labeled voxel order · target voxel planes</span></div></div>
 <div class="below"><section class="box"><h3>Deformation lattice</h3><p>Middle axial target plane mapped to source RAS x/y (mm). Native support only; gaps remain gaps.</p><div class="legend"><span style="color:var(--teal)">Native reference</span><span id="grid-candidate-label" style="color:var(--orange)">neurotransform</span></div><canvas id="grid" width="660" height="340" aria-label="Native and neurotransform deformation lattice"></canvas></section><section class="box"><h3>Fixed target landmarks</h3><p>Same seven target locations in every comparison. Errors are 3D distances in millimetres.</p><table><thead><tr><th>Landmark</th><th>Native source RAS</th><th style="text-align:right">Error (mm)</th></tr></thead><tbody id="landmark-body">${c.landmarks.map(l=>{const valid=l.ours.every(Number.isFinite)&&l.native.every(Number.isFinite);const e=valid?Math.hypot(...l.ours.map((x,i)=>x-l.native[i])):null;return `<tr><td>${l.id}${l.inside?'':' *'}</td><td class="mono">${l.native.map(x=>x==null?'—':x.toFixed(1)).join(', ')}</td><td class="number ${!l.inside?'unavailable':e==null||e>.02?'fail':'pass'}">${fmt(e)}</td></tr>`}).join('')}</tbody></table><p style="margin-top:8px">* Outside the fixed gate mask; shown, not silently removed.</p></section></div>
 <section class="controlstable box"><h3>Does the QA reject known mistakes?</h3><p>Controls change the candidate interpretation while keeping the native reference and mask fixed.</p><table><thead><tr><th>Deliberately wrong interpretation</th><th>Max error (mm)</th><th>Outcome</th></tr></thead><tbody>${c.variant_metrics.map(v=>`<tr><td>${esc(v.label)}</td><td class="mono">${fmt(v.metrics.coordinate_max_mm)}</td><td class="${v.rejected?'pass':'fail'}">${v.rejected?'Rejected':'Not rejected'}</td></tr>`).join('')}</tbody></table></section>
 <div class="scope"><strong>Qualification boundary.</strong> ${Q.limitations.map(esc).join(' ')}</div>
 <details><summary>Gates, commands, and provenance</summary><p>${esc(Q.mask)} Invalid candidate samples count against the finite-data gate. No mask is selected from the candidate output.</p><ul><li>Coordinate maximum ≤ 0.02 mm; image NRMSE ≤ 0.0002; p99 absolute difference / native intensity range ≤ 0.001.</li><li>Negative controls must fail and exhibit ≥ 0.1 mm coordinate error or invalid samples.</li><li>Image residual scale is fixed at 0–1% of each native reference intensity range. Numerical scores use unquantized float data.</li></ul><p>Producer: <code>${esc(Q.images[c.family])}</code></p><p>Candidate: <code>${esc(Q.candidate?.head)}</code> ${Q.candidate?.dirty?'plus uncommitted changes; exact file hashes are in the manifest.':''}</p><p><a href="${c.id}/native.sh">Native command script</a> · <a href="${c.id}/native.log">Native log</a> · <a href="neurotransform.log">Candidate log</a> · <a href="summary.json">All scores</a> · <a href="manifest.json">Inputs, outputs, and source hashes</a></p></details><footer>No network requests or external assets. Rebuild with tools/visual_qa/run.py. A passing case establishes agreement only for its recorded inputs, producer, and gates.</footer>`;
 slices=c.dims.map(n=>Math.floor(n/2));for(const axis of [0,1,2])document.querySelector('#slice-'+axis).oninput=e=>{slices[axis]=Number(e.target.value);drawPlane(axis)};
 for(const id of ['scenario','comparison','opacity','diagnostic'])document.querySelector('#'+id).oninput=()=>render();
 render();
}
function volume(name){if(!volumes[name]){const p=current.volumes[name],bytes=Uint8Array.from(atob(p.bytes),c=>c.charCodeAt(0));volumes[name]={data:new Uint16Array(bytes.buffer),low:p.low,high:p.high}}return volumes[name]}
function value(v,index){const x=v.data[index];return x===65535?NaN:v.low+x/65534*(v.high-v.low)}
const anchors=[[0,0,4],[40,12,70],[81,18,124],[132,33,129],[183,55,121],[230,82,96],[252,137,97],[254,194,135],[252,253,191]];
function heat(t){if(!Number.isFinite(t))return [238,70,208];const f=Math.max(0,Math.min(1,t))*(anchors.length-1),i=Math.min(anchors.length-2,Math.floor(f));return anchors[i].map((x,k)=>Math.round(x+(anchors[i+1][k]-x)*(f-i)))}
function render(){const scenario=document.querySelector('#scenario').value,d=document.querySelector('#diagnostic').value,comp=document.querySelector('#comparison').value;
 const v=current.variant_metrics.find(v=>v.id===scenario),note=document.querySelector('#scenario-note');note.style.display=v?'block':'none';note.textContent=v?`Deliberately wrong: ${v.label}. Max coordinate error ${fmt(v.metrics.coordinate_max_mm)} mm. ${v.rejected?'The fixed gates reject this interpretation.':'The control did not separate from the reference; this case cannot receive PASS.'}`:'';
 document.querySelector('#candidate-label').textContent=v?'Deliberately wrong':'neurotransform';document.querySelector('#comparison-label').textContent=comp==='checker'?'Checkerboard':'Overlay';document.querySelector('#diagnostic-label').textContent={error:'Absolute difference',coord_error:'Coordinate error',jacobian:'Jacobian · correct candidate'}[d];
 document.querySelector('#scale-label').innerHTML=d==='error'?`0 <span class="ramp"></span> ${fmt(current.error_scale)} intensity units (1% of native range)`:d==='coord_error'?`0 <span class="ramp"></span> 0.1 mm · gate 0.02 mm`:`0.5 <span class="ramp"></span> 1.5 · diagnostic only`;
 for(const axis of [0,1,2])drawPlane(axis);
 drawGrid();drawLandmarks();
}
function drawPlane(axis){const c=current,n=c.dims,k=slices[axis],scenario=document.querySelector('#scenario').value,diag=document.querySelector('#diagnostic').value,comparison=document.querySelector('#comparison').value,alpha=Number(document.querySelector('#opacity').value)/100;
 const other=[0,1,2].filter(x=>x!==axis),nx=n[other[0]],ny=n[other[1]],ref=volume('native'),cand=volume(scenario),diagnostic=volume(diag==='jacobian'?'jacobian':scenario==='ours'?diag:scenario+'_'+diag);
 document.querySelector('#slice-value-'+axis).textContent=`${k} / ${n[axis]-1}`;const ijk=slices,xyz=c.affine.slice(0,3).map(row=>row.slice(0,3).reduce((s,x,i)=>s+x*ijk[i],row[3]));document.querySelector('#world-'+axis).textContent=`cursor RAS ${xyz.map(x=>x.toFixed(1)).join(', ')} mm`;
 const spacing=c.affine[0].slice(0,3).map((_,i)=>Math.hypot(...c.affine.slice(0,3).map(row=>row[i]))),ratio=nx*spacing[other[0]]/(ny*spacing[other[1]]);
 const opposite={R:'L',L:'R',A:'P',P:'A',S:'I',I:'S'},horizontal=c.axis_codes[other[0]],vertical=c.axis_codes[other[1]];
 for(let col=0;col<4;col++){const canvas=document.querySelector(`#canvas-${axis}-${col}`),ctx=canvas.getContext('2d'),small=document.createElement('canvas');small.width=nx;small.height=ny;const sx=small.getContext('2d'),im=sx.createImageData(nx,ny);
 for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){const p=[0,0,0];p[axis]=k;p[other[0]]=x;p[other[1]]=ny-1-y;const index=p[0]+n[0]*(p[1]+n[1]*p[2]),a=value(ref,index),b=value(cand,index);let rgb;if(col===3){const z=value(diagnostic,index);rgb=heat((z-diagnostic.low)/(diagnostic.high-diagnostic.low))}else{const z=col===0?a:col===1?b:comparison==='checker'?(((x/5|0)+(y/5|0))%2?a:b):a*(1-alpha)+b*alpha;rgb=Number.isFinite(z)?Array(3).fill(Math.round(Math.max(0,Math.min(1,z/c.window[1]))*255)):[238,70,208]}const j=4*(x+nx*y);for(let i=0;i<3;i++)im.data[j+i]=rgb[i];im.data[j+3]=255}
 sx.putImageData(im,0,0);ctx.fillStyle='#060e14';ctx.fillRect(0,0,canvas.width,canvas.height);let h=canvas.height-16,w=h*ratio;if(w>canvas.width-28){w=canvas.width-28;h=w/ratio}ctx.imageSmoothingEnabled=false;ctx.drawImage(small,(canvas.width-w)/2,(canvas.height-h)/2,w,h);document.querySelector(`#orientation-${axis}-${col}`).innerHTML=`<span class="l">${opposite[horizontal]}</span><span class="r">${horizontal}</span><span class="t">${vertical}</span><span class="b">${opposite[vertical]}</span>`;
 }}
function selectedPoints(l){const id=document.querySelector('#scenario').value;return id==='ours'?l.ours:l.alternatives[id]}
function drawLandmarks(){document.querySelector('#landmark-body').innerHTML=current.landmarks.map(l=>{const p=selectedPoints(l),valid=p.every(Number.isFinite)&&l.native.every(Number.isFinite),e=valid?Math.hypot(...p.map((x,i)=>x-l.native[i])):null;return `<tr><td>${l.id}${l.inside?'':' *'}</td><td class="mono">${l.native.map(x=>x==null?'—':x.toFixed(1)).join(', ')}</td><td class="number ${!l.inside?'unavailable':e==null||e>.02?'fail':'pass'}">${fmt(e)}</td></tr>`}).join('')}
function drawGrid(){const canvas=document.querySelector('#grid'),ctx=canvas.getContext('2d'),scenario=document.querySelector('#scenario').value,get=line=>scenario==='ours'?line.ours:line.alternatives[scenario],pts=current.grid.flatMap(line=>[...line.native,...get(line)]).filter(p=>p&&p.every(Number.isFinite));ctx.fillStyle='#f8fafb';ctx.fillRect(0,0,canvas.width,canvas.height);document.querySelector('#grid-candidate-label').textContent=scenario==='ours'?'neurotransform':'Deliberately wrong';if(!pts.length)return;let lo=[0,1].map(k=>Math.min(...pts.map(p=>p[k]))),hi=[0,1].map(k=>Math.max(...pts.map(p=>p[k])));const scale=Math.min((canvas.width-80)/(hi[0]-lo[0]||1),(canvas.height-55)/(hi[1]-lo[1]||1)),px=p=>[40+(p[0]-lo[0])*scale,canvas.height-28-(p[1]-lo[1])*scale];for(const [key,color] of [['native','#087d82'],['ours','#ee9a4b']]){ctx.strokeStyle=color;ctx.lineWidth=key==='native'?2:1.4;for(const line of current.grid){ctx.beginPath();let started=false;for(const p of key==='native'?line.native:get(line)){if(!p||!p.every(Number.isFinite)){started=false;continue}const [x,y]=px(p);if(started)ctx.lineTo(x,y);else ctx.moveTo(x,y);started=true}ctx.stroke()}}
 for(const l of current.landmarks){const p=selectedPoints(l);if(!l.inside||!p.every(Number.isFinite)||!l.native.every(Number.isFinite))continue;const a=px(l.native),b=px(p);ctx.strokeStyle='#152e3e';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);if(Math.hypot(b[0]-a[0],b[1]-a[1])>5){ctx.beginPath();ctx.moveTo(...b);ctx.lineTo(b[0]-6*Math.cos(ang-.4),b[1]-6*Math.sin(ang-.4));ctx.moveTo(...b);ctx.lineTo(b[0]-6*Math.cos(ang+.4),b[1]-6*Math.sin(ang+.4));ctx.stroke()}ctx.fillStyle='#087d82';ctx.beginPath();ctx.arc(...a,3,0,2*Math.PI);ctx.fill();ctx.fillStyle='#152e3e';ctx.font='11px system-ui';ctx.fillText(l.id,a[0]+5,a[1]-5)}
 ctx.fillStyle='#58707e';ctx.font='12px system-ui';ctx.fillText('Source RAS x (mm)',230,canvas.height-6);ctx.save();ctx.translate(14,230);ctx.rotate(-Math.PI/2);ctx.fillText('Source RAS y (mm)',0,0);ctx.restore()}

choose(Q.cases[0].id);
</script>
